<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Rivalry Showdown</title>
    <style>
      :root {
        --bg: #f4f7f6;
        --card: #ffffff;
        --primary: #ff4757;
        --accent: #1e90ff;
        --success: #2ed573;
        --text: #2f3542;
        --muted: #747d8c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f9fbff, #eefbf4);
        color: var(--text);
        padding: 24px;
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2.4rem, 4vw, 3.2rem);
        color: var(--primary);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .notice {
        background: #fff3cd;
        border: 1px solid #ffe69c;
        color: #7a4d00;
        padding: 12px 14px;
        border-radius: 10px;
        margin: 0 auto 22px;
        max-width: 980px;
        display: none;
      }

      .notice.show {
        display: block;
      }

      .category-title {
        margin: 28px 0 16px;
        font-size: 1.55rem;
        border-bottom: 2px solid #dfe4ea;
        padding-bottom: 8px;
        color: #465063;
      }

      .poll-card {
        background: var(--card);
        border-radius: 16px;
        padding: 20px 18px 18px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
        margin-bottom: 18px;
      }

      .poll-header {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 16px;
      }

      .poll-options {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .option-btn {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border: 2px solid #f0d47d;
        background: linear-gradient(180deg, #ffffff, #fffaf4);
        border-radius: 12px;
        padding: 16px 14px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .option-btn:hover:not(:disabled) {
        background: linear-gradient(180deg, #ff7f50, #ff4757);
        border-color: #ff4757;
        color: white;
        transform: translateY(-1px);
      }

      .option-btn:disabled {
        opacity: 0.9;
        cursor: not-allowed;
      }

      .vs-badge {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff1f2;
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 2px solid #ffd5d9;
      }

      .progress-container {
        width: 100%;
        height: 24px;
        display: flex;
        overflow: hidden;
        border-radius: 12px;
        background: #edf2f7;
        border: 1px solid #e2e8f0;
        margin-bottom: 12px;
      }

      .progress-a {
        background: linear-gradient(90deg, #ff4757, #ff6b6b);
      }

      .progress-b {
        background: linear-gradient(90deg, #1e90ff, #4dabff);
      }

      .poll-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .add-poll-section {
        background: white;
        border-radius: 16px;
        padding: 22px 20px;
        margin-top: 42px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      }

      .add-poll-section h3 {
        margin: 0 0 18px;
      }

      .form-group {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }

      input, select, button {
        font: inherit;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        border: 1px solid #dfe4ea;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }

      .add-btn {
        background: linear-gradient(180deg, #2ed573, #1ebf60);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
      }

      .admin-link {
        display: inline-block;
        margin-top: 18px;
        color: #1e90ff;
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 700px) {
        body { padding: 18px; }
        .poll-options { flex-direction: column; }
        .form-group { flex-direction: column; }
        .poll-footer { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>⚡ Rivalry Showdown</h1>
      <p class="subtitle">Vote for your favorites and see who wins.</p>
    </header>

    <div class="notice" id="notice"></div>

    <div class="container" id="polls-container"></div>

    <div class="container">
      <div class="add-poll-section">
        <h3>Create Your Own Rivalry Poll</h3>
        <form id="create-poll-form">
          <div class="form-group">
            <select id="poll-category" required></select>
          </div>
          <div class="form-group">
            <input type="text" id="option-a-input" placeholder="Option A (e.g. Samosa)" required />
            <input type="text" id="option-b-input" placeholder="Option B (e.g. Pani Puri)" required />
          </div>
          <button type="submit" class="add-btn">Create Poll</button>
        </form>

        <a class="admin-link" href="admin.html?key=RIVALRY_ADMIN_SECRET_2026">Admin: Add Categories</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
